# Context Integrity SoK tool config.
# Per SRS NFR-3: keyword clusters, year range, hop depth, venue lists live here,
# not hardcoded in source. Ported from context_integrity_sok_project_plan.md
# Section 2.1 (keyword clusters) and Section 2.3 (inclusion/exclusion criteria).
# Tweak freely after seeing hop-1 results — nothing here requires a code change.

search:
  start_year: 2023
  end_year: null # null = present

hop_depth: 1 # SRS FR-6 — snowball depth, both directions, from the hop-0 pool
# Dialed back from 2 to 1 after a real run: hop-1 alone found 9,826 papers
# from the 51 seeds, and hop-2 fanned out to 10,000+ more before being
# stopped partway through. Working scope is hop 0+1; the hop-2 papers
# already discovered are still in the DB and in a separate archive export,
# just not part of the working set. Raise this back to 2 if you want to
# resume/redo hop-2 later.

# SRS FR-1 — each list item is one logical query; a nested list means OR-joined
# variant phrasings of the same cluster. Ported verbatim from project plan 2.1.
tracks:
  A:
    label: adversarial poisoning
    keyword_clusters:
      - "indirect prompt injection"
      - "tool poisoning"
      - ["RAG poisoning", "knowledge corruption attack"]
      - ["memory poisoning", "agent backdoor"]
      - ["MCP security", "MCP tool poisoning"]
      - ["skill file attack", "skill poisoning"]
      - ["multi-agent prompt injection", "agent-to-agent injection"]
  B:
    label: incidental contamination
    keyword_clusters:
      - "context rot"
      - "lost in the middle"
      - "distracted by irrelevant context"
      - "context length degradation"
      - "long-horizon agent reliability"
      - ["context management", "context compaction"]
      - "retrieval quality knowledge conflict"

# SRS FR-2 — soft filter: logged on every paper, never a hard exclude.
venues:
  soft_list:
    - ACL Anthology
    - USENIX Security
    - IEEE S&P
    - ACM CCS
    - NDSS
    - NeurIPS
    - ICML
    - ACL
    - EMNLP
    - arXiv
    - ICLR
    - AAAI
    - UAI
    - AAMAS
    - IJCAI
    - ESORICS
    - EuroS&P
    - AsiaCCS

# SRS FR-7 — automatic pre-screening. Ported from project plan Section 2.3.
# This is a pre-filter only (NFR-4): every auto_include/needs_review paper still
# needs the two-coder manual pass from the project plan. auto_exclude is never
# silently dropped from the DB, only from "included" views/exports.
screening:
  include_criteria_text: >
    peer-reviewed or arXiv preprint (2023-2026), addresses LLM agents with tool
    use, RAG, memory, or multi-step autonomy, presents an attack, defense,
    benchmark, or empirical measurement of context contamination or
    context-length/quality degradation.
  exclude_criteria_text: >
    pure jailbreaking papers with no agentic/tool component, training-time-only
    data poisoning (out of scope - this is about runtime context, not
    pretraining), papers only about non-LLM systems.
  # Presence of any of these in title/abstract counts as an "agentic/in-context" signal.
  include_signal_terms:
    - agent
    - agents
    - agentic
    - "tool use"
    - "tool-use"
    - "tool calling"
    - "tool-calling"
    - RAG
    - "retrieval-augmented"
    - "retrieval augmented"
    - memory
    - "multi-step"
    - "multi-agent"
    - autonomy
    - autonomous
    - "in-context"
    - "context window"
  # Any of these with none of include_signal_terms present -> auto_exclude (jailbreak-only).
  jailbreak_only_terms:
    - jailbreak
    - jailbreaking
  # Any of these present, with none of runtime_signal_terms present -> auto_exclude
  # (training-time-only poisoning, out of scope per the plan).
  training_time_only_terms:
    - "training data poisoning"
    - "pretraining poisoning"
    - "data poisoning attack"
    - "backdoor training"
    - "poisoning the training set"
  runtime_signal_terms:
    - "inference time"
    - "inference-time"
    - runtime
    - "context window"
    - "in-context"
    - "deployment time"
    - "test time"
    - "test-time"
  # Very conservative: only fires if NONE of these appear anywhere (rare in this pool).
  llm_presence_terms:
    - LLM
    - "large language model"
    - GPT
    - "language model"
    - Claude
    - Gemini
    - Llama

# SRS FR-8 — track auto-tag signatures. Seeded from both project-plan docs'
# literature maps (author/paper/term signatures known to be Track A or B).
# Human override always wins; auto-tag is never silently overwritten (NFR-4).
track_signatures:
  A:
    - Greshake
    - PoisonedRAG
    - "Zou et al"
    - InjecAgent
    - AgentDojo
    - AgentPoison
    - MCPTox
    - "MCP-SafetyBench"
    - "MCP Security Bench"
    - "MCP tool poisoning"
    - MELON
    - "Skill-Inject"
    - MemoryGraft
    - "Invariant Labs"
    - "indirect prompt injection"
    - "prompt injection"
  B:
    - "Lost in the Middle"
    - "N.F. Liu"
    - "context rot"
    - NoLiMa
    - "distracted by"
    - "knowledge conflict"
    - "long-horizon"
    - "context compaction"
    - AttnComp

apis:
  semantic_scholar:
    base_url: "https://api.semanticscholar.org/graph/v1"
    api_key_env: S2_API_KEY
    # Conservative default without a key; raise once S2_API_KEY is set.
    rate_limit_rps_unauthenticated: 0.3
    rate_limit_rps_authenticated: 1.0
    max_retries: 5
  arxiv:
    base_url: "http://export.arxiv.org/api/query"
    pdf_base_url: "https://arxiv.org/pdf"
    rate_limit_rps: 0.5
    max_retries: 5
  openalex:
    base_url: "https://api.openalex.org"
    contact_email_env: OPENALEX_CONTACT_EMAIL
    rate_limit_rps: 2.0
    max_retries: 5

paths:
  db_path: data/context_sok.db
  pdf_dir: data/papers
  raw_cache_dir: data/cache/raw_responses
  export_dir: data/exports
  seed_csv: seed_papers.csv
  # The dashboard's editable data source (src/excel_source.py) - bootstrapped
  # once from the DB, then this file (not the DB) is what the dashboard reads.
  excel_source: data/exports/paper_dashboard_source.xlsx
